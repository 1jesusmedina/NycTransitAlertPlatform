<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Speed Test</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --border: #2e2e42;
      --accent: #7c6af7;
      --accent-dim: #4a40a8;
      --correct: #4ade80;
      --wrong: #f87171;
      --pending: #6b7280;
      --cursor: #7c6af7;
      --text: #e2e2f0;
      --subtext: #9090b0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 40px;
    }

    /* ── Stats bar ── */
    #stats {
      display: flex;
      gap: 40px;
      margin-bottom: 36px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--accent);
      line-height: 1;
      min-width: 3ch;
      text-align: center;
    }

    .stat-label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--subtext);
    }

    /* ── Timer ring ── */
    #timer-wrap {
      position: relative;
      width: 80px;
      height: 80px;
    }

    #timer-wrap svg {
      transform: rotate(-90deg);
    }

    #timer-ring-bg {
      fill: none;
      stroke: var(--border);
      stroke-width: 4;
    }

    #timer-ring {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear, stroke 0.3s;
    }

    #timer-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent);
    }

    /* ── Quote display ── */
    #quote-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 32px;
      max-width: 720px;
      width: 100%;
      margin-bottom: 20px;
      line-height: 1.9;
      font-size: 1.25rem;
      position: relative;
      user-select: none;
    }

    #quote-box.focused {
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 2px rgba(124,106,247,0.15);
    }

    .char {
      color: var(--pending);
      position: relative;
    }

    .char.correct { color: var(--correct); }
    .char.wrong   { color: var(--wrong); text-decoration: underline; }

    .char.cursor::before {
      content: '';
      position: absolute;
      left: -1px;
      top: 2px;
      bottom: 2px;
      width: 2px;
      background: var(--cursor);
      border-radius: 2px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── Invisible input trick ── */
    #hidden-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
    }

    /* ── Click-to-focus hint ── */
    #focus-hint {
      text-align: center;
      color: var(--subtext);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      margin-bottom: 24px;
      height: 16px;
    }

    /* ── Controls ── */
    #controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 32px;
    }

    button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 8px 20px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    button:hover, button.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Results overlay ── */
    #results {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    #results.show { display: flex; }

    #results h2 {
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--subtext);
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 40px;
      margin: 8px 0;
    }

    .result-item { display: flex; flex-direction: column; gap: 4px; }

    .result-value {
      font-size: 2.8rem;
      font-weight: bold;
      color: var(--accent);
      line-height: 1;
    }

    .result-label {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--subtext);
    }

    #restart-btn {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      padding: 10px 32px;
      font-size: 0.85rem;
      margin-top: 8px;
    }

    #restart-btn:hover {
      background: var(--accent-dim);
      border-color: var(--accent-dim);
      color: white;
    }

    /* ── Missed words list ── */
    #missed-wrap {
      max-width: 720px;
      width: 100%;
    }

    #missed-wrap h3 {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--subtext);
      margin-bottom: 10px;
    }

    #missed-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .missed-word {
      background: rgba(248,113,113,0.12);
      border: 1px solid rgba(248,113,113,0.3);
      color: var(--wrong);
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <h1>Typing Speed Test</h1>

  <!-- Stats -->
  <div id="stats">
    <div class="stat">
      <div class="stat-value" id="wpm-display">0</div>
      <div class="stat-label">WPM</div>
    </div>
    <div class="stat">
      <div id="timer-wrap">
        <svg width="80" height="80" viewBox="0 0 80 80">
          <circle id="timer-ring-bg" cx="40" cy="40" r="34"/>
          <circle id="timer-ring"    cx="40" cy="40" r="34"/>
        </svg>
        <div id="timer-text">—</div>
      </div>
      <div class="stat-label">Seconds</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="acc-display">—</div>
      <div class="stat-label">Accuracy</div>
    </div>
  </div>

  <!-- Duration buttons -->
  <div id="controls">
    <button class="duration-btn active" data-dur="15">15s</button>
    <button class="duration-btn" data-dur="30">30s</button>
    <button class="duration-btn" data-dur="60">60s</button>
    <button class="duration-btn" data-dur="120">120s</button>
  </div>

  <!-- Quote display -->
  <div id="quote-box" tabindex="0" role="textbox" aria-label="Typing area">
    <input id="hidden-input" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" aria-hidden="true"/>
    <span id="quote-chars"></span>
  </div>

  <div id="focus-hint">Click the box above or press any key to start</div>

  <!-- Results -->
  <div id="results">
    <h2>Results</h2>
    <div class="result-grid">
      <div class="result-item">
        <div class="result-value" id="res-wpm">0</div>
        <div class="result-label">WPM</div>
      </div>
      <div class="result-item">
        <div class="result-value" id="res-acc">0%</div>
        <div class="result-label">Accuracy</div>
      </div>
      <div class="result-item">
        <div class="result-value" id="res-correct">0</div>
        <div class="result-label">Correct</div>
      </div>
      <div class="result-item">
        <div class="result-value" id="res-wrong">0</div>
        <div class="result-label">Errors</div>
      </div>
    </div>
    <button id="restart-btn">Try Again</button>
  </div>

  <!-- Missed words -->
  <div id="missed-wrap" style="display:none">
    <h3>Missed words</h3>
    <div id="missed-list"></div>
  </div>

  <script>
    // ── Quotes pool ──────────────────────────────────────────────────────────
    const QUOTES = [
      "The quick brown fox jumps over the lazy dog near the river bank.",
      "Practice makes perfect, but nobody is perfect, so why practice at all.",
      "The art of programming is the art of organizing complexity.",
      "Code is like humor. When you have to explain it, it's bad.",
      "First solve the problem, then write the code.",
      "Any fool can write code that a computer can understand. Good programmers write code that humans can understand.",
      "Experience is the name everyone gives to their mistakes.",
      "In order to be irreplaceable, one must always be different.",
      "Java is to JavaScript what car is to carpet.",
      "The best way to get a project done faster is to start sooner.",
      "Simplicity is the soul of efficiency.",
      "Make it work, make it right, make it fast.",
      "The most disastrous thing that you can ever learn is your first programming language.",
      "A language that doesn't affect the way you think about programming is not worth knowing.",
      "The computer was born to solve problems that did not exist before.",
      "It is not enough to do your best; you must know what to do, and then do your best.",
      "Programs must be written for people to read, and only incidentally for machines to execute.",
      "The only way to learn a new programming language is by writing programs in it.",
      "Computers are good at following instructions, but not at reading your mind.",
      "An algorithm must be seen to be believed.",
    ];

    // ── State ────────────────────────────────────────────────────────────────
    let duration    = 15;
    let timeLeft    = 15;
    let timerHandle = null;
    let started     = false;
    let finished    = false;

    let quote       = '';
    let typed       = '';   // characters typed so far
    let totalTyped  = 0;    // all keystrokes (for accuracy)
    let wrongTyped  = 0;

    // ── DOM refs ─────────────────────────────────────────────────────────────
    const quoteBox    = document.getElementById('quote-box');
    const hiddenInput = document.getElementById('hidden-input');
    const quoteChars  = document.getElementById('quote-chars');
    const wpmDisplay  = document.getElementById('wpm-display');
    const accDisplay  = document.getElementById('acc-display');
    const timerText   = document.getElementById('timer-text');
    const timerRing   = document.getElementById('timer-ring');
    const focusHint   = document.getElementById('focus-hint');
    const resultsEl   = document.getElementById('results');
    const missedWrap  = document.getElementById('missed-wrap');
    const missedList  = document.getElementById('missed-list');

    // ── Timer ring setup ─────────────────────────────────────────────────────
    const CIRCUMFERENCE = 2 * Math.PI * 34; // r=34
    timerRing.style.strokeDasharray  = CIRCUMFERENCE;
    timerRing.style.strokeDashoffset = 0;

    function updateRing() {
      const pct    = timeLeft / duration;
      const offset = CIRCUMFERENCE * (1 - pct);
      timerRing.style.strokeDashoffset = offset;
      // Turn red in last 5 seconds
      timerRing.style.stroke = timeLeft <= 5 ? '#f87171' : 'var(--accent)';
      timerText.style.color  = timeLeft <= 5 ? '#f87171' : 'var(--accent)';
    }

    // ── Pick a random quote ───────────────────────────────────────────────────
    function pickQuote() {
      return QUOTES[Math.floor(Math.random() * QUOTES.length)];
    }

    // ── Render the character spans ────────────────────────────────────────────
    function renderChars() {
      quoteChars.innerHTML = '';
      for (let i = 0; i < quote.length; i++) {
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = quote[i] === ' ' ? '\u00a0' : quote[i]; // nbsp for spaces

        if (i < typed.length) {
          span.classList.add(typed[i] === quote[i] ? 'correct' : 'wrong');
        } else if (i === typed.length) {
          span.classList.add('cursor');
        }

        quoteChars.appendChild(span);
      }
    }

    // ── Calculate live WPM ────────────────────────────────────────────────────
    function calcWPM() {
      const elapsed = (duration - timeLeft) || 1;
      // Count correctly typed characters up to cursor
      let correct = 0;
      for (let i = 0; i < typed.length; i++) {
        if (typed[i] === quote[i]) correct++;
      }
      return Math.round((correct / 5) / (elapsed / 60));
    }

    function calcAccuracy() {
      if (totalTyped === 0) return 100;
      return Math.round(((totalTyped - wrongTyped) / totalTyped) * 100);
    }

    // ── Start timer ───────────────────────────────────────────────────────────
    function startTimer() {
      started = true;
      focusHint.textContent = '';
      timerText.textContent = timeLeft;
      updateRing();

      timerHandle = setInterval(() => {
        timeLeft--;
        timerText.textContent = timeLeft;
        updateRing();

        // Update live WPM
        const wpm = calcWPM();
        wpmDisplay.textContent = wpm;
        accDisplay.textContent = calcAccuracy() + '%';

        if (timeLeft <= 0) {
          clearInterval(timerHandle);
          endGame();
        }
      }, 1000);
    }

    // ── End game ──────────────────────────────────────────────────────────────
    function endGame() {
      finished = true;
      hiddenInput.blur();
      quoteBox.classList.remove('focused');

      const wpm = calcWPM();
      const acc = calcAccuracy();

      // Count correct / wrong chars
      let correct = 0, wrong = 0;
      for (let i = 0; i < typed.length; i++) {
        if (typed[i] === quote[i]) correct++; else wrong++;
      }

      document.getElementById('res-wpm').textContent     = wpm;
      document.getElementById('res-acc').textContent     = acc + '%';
      document.getElementById('res-correct').textContent = correct;
      document.getElementById('res-wrong').textContent   = wrong;

      resultsEl.classList.add('show');

      // Find missed words
      const words      = quote.split(' ');
      let charIdx      = 0;
      const missedWords = [];

      words.forEach(word => {
        const slice = typed.slice(charIdx, charIdx + word.length);
        if (slice !== word) missedWords.push(word);
        charIdx += word.length + 1; // +1 for space
      });

      if (missedWords.length > 0) {
        missedList.innerHTML = '';
        missedWords.forEach(w => {
          const el = document.createElement('span');
          el.className   = 'missed-word';
          el.textContent = w;
          missedList.appendChild(el);
        });
        missedWrap.style.display = 'block';
      }
    }

    // ── Reset / init ──────────────────────────────────────────────────────────
    function init() {
      clearInterval(timerHandle);
      started   = false;
      finished  = false;
      timeLeft  = duration;
      typed     = '';
      totalTyped = 0;
      wrongTyped = 0;
      quote     = pickQuote();

      hiddenInput.value         = '';
      wpmDisplay.textContent    = '0';
      accDisplay.textContent    = '—';
      timerText.textContent     = '—';
      timerRing.style.stroke    = 'var(--accent)';
      timerText.style.color     = 'var(--accent)';
      timerRing.style.strokeDashoffset = 0;
      focusHint.textContent     = 'Click the box above or press any key to start';

      resultsEl.classList.remove('show');
      missedWrap.style.display  = 'none';
      missedList.innerHTML      = '';

      renderChars();
    }

    // ── Focus handling ────────────────────────────────────────────────────────
    quoteBox.addEventListener('click', () => {
      if (!finished) {
        hiddenInput.focus();
        quoteBox.classList.add('focused');
        focusHint.textContent = '';
      }
    });

    hiddenInput.addEventListener('focus', () => quoteBox.classList.add('focused'));
    hiddenInput.addEventListener('blur',  () => quoteBox.classList.remove('focused'));

    // Start on any keypress even outside the box
    document.addEventListener('keydown', (e) => {
      if (!finished && !started && e.key.length === 1) {
        hiddenInput.focus();
        quoteBox.classList.add('focused');
      }
    });

    // ── Input handler ─────────────────────────────────────────────────────────
    hiddenInput.addEventListener('input', (e) => {
      if (finished) return;

      const val = hiddenInput.value;

      // Start timer on first character
      if (!started && val.length > 0) startTimer();

      // Track keystrokes for accuracy
      if (val.length > typed.length) {
        totalTyped++;
        const newChar = val[val.length - 1];
        if (newChar !== quote[val.length - 1]) wrongTyped++;
      }

      typed = val;

      // Don't allow typing past the quote length
      if (typed.length > quote.length) {
        typed = typed.slice(0, quote.length);
        hiddenInput.value = typed;
      }

      renderChars();

      // Auto-advance when quote is complete
      if (typed.length === quote.length) {
        // Give a brief moment to see the completed state, then load new quote
        setTimeout(() => {
          quote = pickQuote();
          typed = '';
          hiddenInput.value = '';
          renderChars();
        }, 300);
      }
    });

    // Prevent backspace/tab from navigating away
    hiddenInput.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') e.preventDefault();
    });

    // ── Duration buttons ──────────────────────────────────────────────────────
    document.querySelectorAll('.duration-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        duration = parseInt(btn.dataset.dur);
        init();
      });
    });

    // ── Restart button ────────────────────────────────────────────────────────
    document.getElementById('restart-btn').addEventListener('click', init);

    // ── Keyboard shortcut: Tab to restart ────────────────────────────────────
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        init();
      }
    });

    // ── Boot ──────────────────────────────────────────────────────────────────
    init();
  </script>
</body>
</html>
