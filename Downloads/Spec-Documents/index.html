<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paddle Ball Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
    }

    canvas {
      background-color: white;
      display: block;
      border: 3px solid #333;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="600" height="300"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');

    if (!ctx) {
      console.error('Canvas not supported in this browser.');
    }

    // ─── Customization ───────────────────────────────────────────────────────
    const BALL_COLOR    = 'red';
    const PADDLE_COLOR  = 'blue';
    const BG_COLOR      = 'white';
    const WIN_SCORE     = 5;

    // ─── Constants ───────────────────────────────────────────────────────────
    const BALL_SPEED    = 4;
    const PADDLE_W      = 8;
    const PADDLE_H      = 80;
    const PADDLE_SPEED  = 7;
    const PADDLE_OFFSET = 10;
    const AI_DIFFICULTY = 0.7;

    // ─── Score ────────────────────────────────────────────────────────────────
    let scoreLeft  = 0; // AI
    let scoreRight = 0; // Player
    let winner     = null; // null | 'AI' | 'Player'

    // ─── Particles ────────────────────────────────────────────────────────────
    let particles = [];

    function spawnParticles(x, y) {
      for (let i = 0; i < 24; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        particles.push({
          x, y,
          dx: Math.cos(angle) * speed,
          dy: Math.sin(angle) * speed,
          life: 1.0,                        // 1.0 → 0.0 as it fades
          radius: Math.random() * 4 + 2,
          color: Math.random() < 0.5 ? 'red' : 'blue'
        });
      }
    }

    function updateParticles() {
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.x    += p.dx;
        p.y    += p.dy;
        p.dy   += 0.1; // gravity
        p.life -= 0.03;
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle   = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    // ─── Ball ─────────────────────────────────────────────────────────────────
    let ball = {
      x: canvas.width  / 2,
      y: canvas.height / 2,
      dx: 0,
      dy: 0,
      radius: 8
    };

    // ─── Paddles ──────────────────────────────────────────────────────────────
    let leftY  = (canvas.height - PADDLE_H) / 2;
    let rightY = (canvas.height - PADDLE_H) / 2;

    // ─── Ball initialization ──────────────────────────────────────────────────
    function resetBall() {
      ball.x = canvas.width  / 2;
      ball.y = canvas.height / 2;
      const dirX  = Math.random() < 0.5 ? -1 : 1;
      const angle = (Math.random() * 90 - 45) * (Math.PI / 180);
      ball.dx = dirX * BALL_SPEED * Math.cos(angle);
      ball.dy =        BALL_SPEED * Math.sin(angle);
    }
    resetBall();

    // ─── Scoreboard drawing ───────────────────────────────────────────────────
    function drawScoreboard() {
      const boxW = 110, boxH = 50, gap = 20;
      const totalW = boxW * 2 + gap;
      const startX = (canvas.width - totalW) / 2;
      const startY = 10;

      // Left box — AI
      ctx.strokeStyle = '#333';
      ctx.lineWidth   = 2;
      ctx.strokeRect(startX, startY, boxW, boxH);

      ctx.fillStyle = 'rgba(0,0,200,0.08)';
      ctx.fillRect(startX, startY, boxW, boxH);

      ctx.fillStyle = '#333';
      ctx.font      = 'bold 11px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('AI', startX + boxW / 2, startY + 16);

      ctx.font      = 'bold 22px Courier New';
      ctx.fillStyle = 'blue';
      ctx.fillText(scoreLeft, startX + boxW / 2, startY + 42);

      // Right box — Player
      const rx = startX + boxW + gap;
      ctx.strokeStyle = '#333';
      ctx.lineWidth   = 2;
      ctx.strokeRect(rx, startY, boxW, boxH);

      ctx.fillStyle = 'rgba(200,0,0,0.08)';
      ctx.fillRect(rx, startY, boxW, boxH);

      ctx.fillStyle = '#333';
      ctx.font      = 'bold 11px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('PLAYER', rx + boxW / 2, startY + 16);

      ctx.font      = 'bold 22px Courier New';
      ctx.fillStyle = 'red';
      ctx.fillText(scoreRight, rx + boxW / 2, startY + 42);

      // "First to N wins" subtitle
      ctx.fillStyle = '#888';
      ctx.font      = '10px Courier New';
      ctx.fillText(`First to ${WIN_SCORE} wins`, canvas.width / 2, startY + boxH + 14);

      ctx.textAlign = 'left'; // reset
    }

    // ─── Win screen ───────────────────────────────────────────────────────────
    function drawWinScreen() {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign  = 'center';
      ctx.font       = 'bold 36px Courier New';
      ctx.fillStyle  = winner === 'Player' ? 'red' : 'blue';
      ctx.fillText(`${winner} Wins!`, canvas.width / 2, canvas.height / 2 - 16);

      ctx.font      = '16px Courier New';
      ctx.fillStyle = 'white';
      ctx.fillText('Press Space to play again', canvas.width / 2, canvas.height / 2 + 20);

      ctx.textAlign = 'left';
    }

    // ─── Drawing ──────────────────────────────────────────────────────────────
    function draw() {
      // Background
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = BG_COLOR;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed divider
      ctx.setLineDash([10, 10]);
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth   = 2;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Scoreboard
      drawScoreboard();

      // Left paddle (AI)
      ctx.fillStyle = PADDLE_COLOR;
      ctx.fillRect(PADDLE_OFFSET, leftY, PADDLE_W, PADDLE_H);

      // Right paddle (Player)
      ctx.fillRect(canvas.width - PADDLE_OFFSET - PADDLE_W, rightY, PADDLE_W, PADDLE_H);

      // Ball
      ctx.fillStyle = BALL_COLOR;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();

      // Particles
      drawParticles();

      // Win overlay
      if (winner) drawWinScreen();
    }
    draw();

    // ─── Update ───────────────────────────────────────────────────────────────
    function update() {
      if (winner) return; // freeze game on win

      updateParticles();

      // Move ball
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Top / bottom wall
      if (ball.y - ball.radius <= 0) {
        ball.y  = ball.radius;
        ball.dy = Math.abs(ball.dy);
      } else if (ball.y + ball.radius >= canvas.height) {
        ball.y  = canvas.height - ball.radius;
        ball.dy = -Math.abs(ball.dy);
      }

      // Left paddle (AI) collision
      const leftPaddleRight = PADDLE_OFFSET + PADDLE_W;
      if (
        ball.dx < 0 &&
        ball.x - ball.radius <= leftPaddleRight &&
        ball.x - ball.radius >= PADDLE_OFFSET &&
        ball.y >= leftY &&
        ball.y <= leftY + PADDLE_H
      ) {
        ball.x  = leftPaddleRight + ball.radius;
        ball.dx = Math.abs(ball.dx);
      }

      // Right paddle (Player) collision
      const rightPaddleLeft = canvas.width - PADDLE_OFFSET - PADDLE_W;
      if (
        ball.dx > 0 &&
        ball.x + ball.radius >= rightPaddleLeft &&
        ball.x + ball.radius <= canvas.width - PADDLE_OFFSET &&
        ball.y >= rightY &&
        ball.y <= rightY + PADDLE_H
      ) {
        ball.x  = rightPaddleLeft - ball.radius;
        ball.dx = -Math.abs(ball.dx);
      }

      // Ball exits left → Player scores
      if (ball.x + ball.radius < 0) {
        spawnParticles(20, ball.y);
        scoreRight++;
        if (scoreRight >= WIN_SCORE) winner = 'Player';
        resetBall();
      }

      // Ball exits right → AI scores
      if (ball.x - ball.radius > canvas.width) {
        spawnParticles(canvas.width - 20, ball.y);
        scoreLeft++;
        if (scoreLeft >= WIN_SCORE) winner = 'AI';
        resetBall();
      }
    }

    // ─── Player input ─────────────────────────────────────────────────────────
    const keys = { ArrowUp: false, ArrowDown: false };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        keys[e.key] = true;
      }
      // Restart on Space after game over
      if (e.key === ' ' && winner) {
        scoreLeft  = 0;
        scoreRight = 0;
        winner     = null;
        particles  = [];
        leftY      = (canvas.height - PADDLE_H) / 2;
        rightY     = (canvas.height - PADDLE_H) / 2;
        resetBall();
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        keys[e.key] = false;
      }
    });

    function movePlayer() {
      if (keys.ArrowUp)   rightY -= PADDLE_SPEED;
      if (keys.ArrowDown) rightY += PADDLE_SPEED;
      rightY = Math.max(0, Math.min(canvas.height - PADDLE_H, rightY));
    }

    // ─── AI ───────────────────────────────────────────────────────────────────
    function moveAI() {
      const diff = (ball.y) - (leftY + PADDLE_H / 2);
      leftY += diff * AI_DIFFICULTY;
      leftY  = Math.max(0, Math.min(canvas.height - PADDLE_H, leftY));
    }

    // ─── Game loop (~60 FPS) ──────────────────────────────────────────────────
    setInterval(() => {
      movePlayer();
      moveAI();
      update();
      draw();
    }, 1000 / 60);
  </script>
</body>
</html>
